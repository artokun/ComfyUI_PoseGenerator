name: Release checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install validation dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Python and HTTP behavior
        run: python -m pytest -q
      - name: Frontend syntax
        run: node --check web/pose-gallery.js
      - name: Build archive, verify metadata and runtime files, scan with YARA
        run: python scripts/check_release.py
      - name: Bandit on the exact staged archive
        run: bandit -r .build/package -s B101,B112,B311
      - uses: actions/upload-artifact@v6
        with:
          name: checked-registry-package
          path: |
            .build/node.zip
            .build/manifest.json
          if-no-files-found: error
